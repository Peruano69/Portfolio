<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MARIANO AGUILERA PANEQUE — Construyo webs y me aseguro de que sigan en pie.">
  <rect width="1200" height="630" fill="#F0F0EC"/>

  <!-- Barra superior tipo status page -->
  <line x1="80" y1="112" x2="1120" y2="112" stroke="#DBDBD3" stroke-width="2"/>
  <text x="80" y="84" font-family="'IBM Plex Mono', monospace" font-size="24" letter-spacing="3" fill="#14181C">MARIANO AGUILERA PANEQUE</text>
  <circle cx="1010" cy="76" r="7" fill="#1F9D55"/>
  <text x="1030" y="84" font-family="'IBM Plex Mono', monospace" font-size="24" letter-spacing="3" fill="#5A6570">ONLINE</text>

  <!-- Titular -->
  <text font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="82" letter-spacing="-2" fill="#14181C">
    <tspan x="80" y="290">Construyo webs y me</tspan>
    <tspan x="80" y="378">aseguro de que sigan</tspan>
    <tspan x="80" y="466">en pie.</tspan>
  </text>

  <!-- Fila de estado inferior -->
  <line x1="80" y1="536" x2="1120" y2="536" stroke="#DBDBD3" stroke-width="2"/>
  <circle cx="88" cy="580" r="7" fill="#1F9D55"/>
  <text x="108" y="588" font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="3" fill="#1F9D55">EN PRODUCCIÓN</text>
  <text x="360" y="588" font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="2" fill="#5A6570">DESARROLLO · MANTENIMIENTO · DNS · CORE WEB VITALS</text>
</svg>
